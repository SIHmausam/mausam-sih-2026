services:
  postgres:
    image: postgres:17-alpine
    container_name: mausam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mausam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - mausam_postgres_data:/var/lib/postgresql/data

volumes:
  mausam_postgres_data: